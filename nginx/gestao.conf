# ═══════════════════════════════════════════════════════════
# Reverse proxy do subdomínio da Dual → API do sistema de gestão
#   gestao.dualcomunicacao.com.br  →  container gestao-api:8000
#
# A API já serve a SPA em /app e a raiz (/) redireciona para /app/,
# então basta encaminhar TODO o tráfego para a API.
# ═══════════════════════════════════════════════════════════

# ---- HTTP (porta 80) ----
server {
    listen 80;
    listen [::]:80;
    server_name gestao.dualcomunicacao.com.br;

    # Desafio do Let's Encrypt (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Depois de emitir o certificado (ver DEPLOY.md), descomente para
    # forçar HTTPS:
    # location / { return 301 https://$host$request_uri; }

    location / {
        # resolve o IP do container a cada 30s (sobrevive a restart da API)
        resolver 127.0.0.11 valid=30s;
        set $upstream http://gestao-api:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

